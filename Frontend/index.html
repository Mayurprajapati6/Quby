<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Quby — Smart Salon Queue Booking" />
    <meta name="theme-color" content="#7c3aed" id="theme-color-meta" />

    <script>
      const stored = localStorage.getItem('quby_ui');
      if (stored) {
        try {
          const theme = JSON.parse(stored).state.theme;
          if (theme) {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {}
      }
    </script>
