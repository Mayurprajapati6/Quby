<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Quby — Smart Salon Queue Booking" />
    <meta name="theme-color" content="#7c3aed" id="theme-color-meta" />

    <!-- ✅ CRITICAL CSS: Prevent FOUC (Flash of Unstyled Content) -->
    <style>
      /* Prevent black flash on load */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #16172b;
        color: #dde0ff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      
      /* Hide content until CSS loads */
      #root {
        opacity: 0;
        transition: opacity 0.15s ease-in;
      }
      
      #root.loaded {
        opacity: 1;
      }
      
      /* Prevent white flash during theme switch */
      [data-theme="light"] {
        background-color: #f8f9fa;
        color: #1a1a1a;
      }
    </style>

    <script>
      const stored = localStorage.getItem('quby_ui');
      if (stored) {
        try {
          const theme = JSON.parse(stored).state.theme;
          if (theme) {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {}
      }
      
      // ✅ Show content when DOM is ready
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          document.getElementById('root')?.classList.add('loaded');
        }, 50);
      });
    </script>

    <!--
      Favicon — The Mirror Mark
      Same shape as Logo.tsx: circle (mirror glass) + stand + base arc + shimmer
      Gradient: #c084fc → #7c3aed (exact --violet-light → --violet from your theme)
    -->

    <!-- Google Fonts — Syne + DM Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Razorpay Checkout SDK -->

    <title>Quby</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
